<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <title>Redstone tray</title>
  <desc>
    The same "r." mark, silhouetted for the menu bar. macOS template images are
    drawn from the alpha channel alone, so the fill colour here only matters on
    Windows and Linux, where a light mark reads against a dark tray.

    The lockup is 1334×992 glyph units ('r' from x=71, the full stop ending at
    957+448). Scaled by 0.0209 that is 27.9×20.7px, centred in the 32px canvas
    with 2px of air: a point (x, y) lands at (0.58 + 0.0209x, 25.91 − 0.0209y).
  </desc>
