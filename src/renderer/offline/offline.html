<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;"
    />
    <title>Redstone — can't connect</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: #15110d;
        color: #f3eee3;
        font: 15px/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        -webkit-user-select: none;
        user-select: none;
      }
      .card {
        max-width: 460px;
        padding: 32px;
      }
      .glyph {
        display: block;
        margin: 0 auto 18px;
        color: #e54d2e;
      }
      /* Pulses only while a probe is actually in flight, so the animation means
         something rather than decorating a dead screen. */
      .glyph.checking {
        animation: pulse 1.1s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .glyph.checking {
          animation: none;
        }
      }
      @keyframes pulse {
        50% {
          opacity: 0.45;
        }
      }
      h1 {
        font-size: 17px;
        margin: 0 0 8px;
      }
      p {
        color: #a49c8d;
        margin: 0 0 22px;
      }
      button {
        font: inherit;
        border: 0;
        border-radius: 9px;
        background: #e54d2e;
        color: #fff;
        padding: 9px 18px;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: #f06e50;
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .status {
        margin-top: 18px;
        font-size: 12.5px;
        color: #7d7669;
        min-height: 1.5em;
      }
      .detail {
        margin-top: 6px;
        font-size: 11.5px;
        color: #5d574d;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <!-- A struck-through signal, drawn on the same 24px grid and 1.6 stroke as
           the rest of the shell's icons. It carries the state on its own, so
           the screen reads correctly before anyone gets to the text. -->
      <svg class="glyph" id="gem" viewBox="0 0 24 24" width="46" height="46" aria-hidden="true">
        <path
          d="M2 8.5a15.5 15.5 0 0 1 6-3.6M13.2 5.2A15.5 15.5 0 0 1 22 8.5M5.5 12.2a11 11 0 0 1 3.2-2M15.6 10.4a11 11 0 0 1 2.9 1.8M9 15.8a6 6 0 0 1 5.2.4M3 3l18 18"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
        <circle cx="12" cy="19.5" r="1.15" fill="currentColor" />
      </svg>
      <h1 id="title">Can't reach Redstone</h1>
      <p id="body">
        Your folders keep syncing in the background and the queue drains as soon as the
        connection is back.
      </p>
      <button id="retry" type="button">Try again</button>
      <div class="status" id="status"></div>
      <div class="detail" id="detail"></div>
    </div>
    <script src="offline.js"></script>
  </body>
</html>
