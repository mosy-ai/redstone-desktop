<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'unsafe-inline';"
    />
    <title>Redstone — offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: #12141a;
        color: #f2f4f7;
        font: 15px/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        -webkit-user-select: none;
        user-select: none;
      }
      .card {
        max-width: 420px;
        padding: 32px;
      }
      .gem {
        width: 34px;
        height: 34px;
        margin: 0 auto 20px;
        transform: rotate(45deg);
        border-radius: 6px;
        background: linear-gradient(150deg, #e6524b, #a12520);
        box-shadow: 0 0 26px rgba(230, 82, 75, 0.45);
      }
      h1 {
        font-size: 17px;
        margin: 0 0 8px;
      }
      p {
        color: #9aa1ad;
        margin: 0 0 22px;
      }
      button {
        font: inherit;
        border: 0;
        border-radius: 9px;
        background: #e6524b;
        color: #fff;
        padding: 9px 18px;
        cursor: pointer;
      }
      button:hover {
        background: #f0605a;
      }
      .detail {
        margin-top: 18px;
        font-size: 12px;
        color: #6f7784;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="gem"></div>
      <h1>Can't reach Redstone</h1>
      <p>
        Your folders keep syncing in the background and the queue drains as soon as the
        connection is back.
      </p>
      <button id="retry" type="button">Try again</button>
      <div class="detail" id="detail"></div>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const reason = params.get('reason');
      if (reason) document.getElementById('detail').textContent = reason;
      document.getElementById('retry').addEventListener('click', () => {
        window.redstone?.openMainWindow({});
        location.reload();
      });
      setTimeout(() => window.redstone?.openMainWindow({}), 15000);
    </script>
  </body>
</html>
