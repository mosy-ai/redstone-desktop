name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck and unit tests once — they are platform independent.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Installers are built on their own OS: code signing and the platform tooling
  # (NSIS, dmg, dpkg) all want a native host, even though the JS bundle itself is
  # identical everywhere.
  package:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: mac
            args: --mac
          - os: windows-latest
            name: win
            args: --win
          - os: ubuntu-latest
            name: linux
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The icon renderer draws through Electron, so the Linux runner needs a
      # display for it as much as for the smoke test.
      # Two releases in a row were blocked here by the runner failing to resolve
      # archive.ubuntu.com — nothing to do with this project, but it fails the
      # whole job. Retry, and on the last attempt accept whatever apt could
      # fetch: a missing package surfaces as a real failure in the icon or smoke
      # step below, which is a far more honest place to stop than a mirror
      # lookup.
      - name: Install Linux deps
        if: matrix.name == 'linux'
        run: |
          packages="xvfb libnotify4 libsecret-1-0"
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y $packages; then
              echo "apt: installed on attempt $attempt"
              exit 0
            fi
            echo "apt: attempt $attempt failed"
            sleep $((attempt * 15))
          done
          echo "apt: giving up on the mirrors; continuing with --fix-missing"
          sudo apt-get install -y --fix-missing $packages || true
      - name: Icons (linux)
        if: matrix.name == 'linux'
        run: xvfb-run --auto-servernum npm run icons
      - name: Icons
        if: matrix.name != 'linux'
        run: npm run icons

      - run: npm run build

      # Proves the bundle actually boots on this platform, not just that it
      # compiled. Linux runners have no display server.
      - name: Smoke test (linux)
        if: matrix.name == 'linux'
        run: xvfb-run --auto-servernum npm run smoke
      - name: Smoke test
        if: matrix.name != 'linux'
        run: npm run smoke

      - name: Package
        shell: bash
        env:
          # Signing is opt-in: forks and PRs build unsigned artifacts rather
          # than failing.
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CERT_PFX }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # An unset secret still arrives as an empty variable, and
          # electron-builder reads an empty CSC_LINK as a certificate *path*,
          # resolves it to the project directory and dies with "not a file".
          # Drop the blanks so the unsigned path is taken cleanly.
          for var in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD \
                     APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!var}" ]; then unset "$var"; fi
          done
          if [ -z "${CSC_LINK:-}" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          npx electron-builder ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: redstone-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/latest*.yml
          if-no-files-found: warn
